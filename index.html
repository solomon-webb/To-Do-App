<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content">
          <div class="greeting">
            <h1>Todo App</h1>
            <p>Organize your tasks</p>
          </div>
          <div class="header-icons">
            <button
              class="icon-btn add-icon"
              id="addBtn"
              type="button"
              aria-label="Add task"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat-card blue">
          <div class="stat-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">Today</span>
            <span class="stat-number" id="stat-Today">0</span>
          </div>
        </div>

        <div class="stat-card yellow">
          <div class="stat-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">Scheduled</span>
            <span class="stat-number" id="stat-Scheduled">0</span>
          </div>
        </div>

        <div class="stat-card green">
          <div class="stat-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">All</span>
            <span class="stat-number" id="stat-all">0</span>
          </div>
        </div>

        <div class="stat-card pink">
          <div class="stat-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 8 14"></polyline>
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-label">Overdue</span>
            <span class="stat-number" id="stat-Overdue">0</span>
          </div>
        </div>
      </div>

      <div class="tasks-section">
        <h2>Tasks</h2>
        <div class="filter-bar" aria-label="Task filters">
          <button class="filter-btn active" type="button" data-filter="all">
            All
          </button>
          <button class="filter-btn" type="button" data-filter="active">
            Active
          </button>
          <button class="filter-btn" type="button" data-filter="completed">
            Completed
          </button>
        </div>
        <div class="task-list" id="todoList"></div>
      </div>
    </div>

    <button class="fab" id="addBtn2" type="button" aria-label="Add task">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <div class="modal" id="addTaskModal" aria-hidden="true">
      <div class="modal-overlay" data-close="true"></div>
      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-header">
          <h2 id="modalTitle">Add New Task</h2>
          <button
            class="modal-close"
            id="closeModal"
            type="button"
            aria-label="Close modal"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="taskTitle">Task Title</label>
            <input
              type="text"
              id="taskTitle"
              placeholder="Enter task title"
              required
            />
            <p class="error" id="titleError"></p>
          </div>
          <div class="form-group">
            <label for="taskDescription">Description</label>
            <textarea
              id="taskDescription"
              placeholder="Enter task description"
              rows="4"
              required
            ></textarea>
            <p class="error" id="descriptionError"></p>
          </div>
          <div class="form-group">
            <label for="taskSchedule">Schedule Date</label>
            <input type="date" id="taskSchedule" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="cancelBtn" type="button">
            Cancel
          </button>
          <button class="btn-add" id="addTask" type="button">Add Task</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
